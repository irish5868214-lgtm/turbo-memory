<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>စိတ်ဆိုးပြေတော့နော် ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #fbcfe8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, sans-serif;
            position: relative;
        }

        .bg-floating-heart {
            position: absolute;
            font-size: clamp(18px, 3vw, 26px);
            animation: floatUp 6s linear infinite;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translate3d(0, 105vh, 0) scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translate3d(0, -12vh, 0) scale(1.2);
                opacity: 0;
            }
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            padding: clamp(12px, 3vw, 24px);
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.45s ease, transform 0.45s ease;
            z-index: 5;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .card {
            background: transparent;
            padding: clamp(12px, 3vw, 24px);
            text-align: center;
            max-width: 480px;
            width: 100%;
            z-index: 10;
            margin: auto;
        }

        h1 {
            color: #0284c7;
            font-size: clamp(1.35rem, 4.5vw, 1.9rem);
            margin-bottom: clamp(14px, 3vw, 22px);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.85);
            line-height: 1.4;
        }

        p {
            color: #475569;
            font-size: clamp(0.95rem, 3vw, 1.08rem);
            margin-bottom: clamp(14px, 3vw, 20px);
            line-height: 1.55;
        }

        .media-container {
            width: 100%;
            height: clamp(160px, 28vh, 230px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: clamp(12px, 2.5vw, 18px);
        }

        .media-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 20px;
            display: block;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: clamp(10px, 3vw, 16px);
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: clamp(10px, 2.5vw, 13px) clamp(22px, 5vw, 32px);
            font-size: clamp(0.95rem, 3.2vw, 1.1rem);
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            touch-action: manipulation;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-no {
            background: #cbd5e1;
            color: #334155;
            box-shadow: none;
        }

        .btn.centered-final-btn {
            transform: scale(1) !important;
            padding: clamp(12px, 3vw, 14px) clamp(26px, 6vw, 36px);
            font-size: clamp(1rem, 3.5vw, 1.15rem);
            background: linear-gradient(135deg, #0284c7 0%, #8b5cf6 100%);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        /* Punch Arena Styles */
        .punch-target-img {
            width: clamp(95px, 24vw, 130px);
            height: clamp(95px, 24vw, 130px);
            object-fit: contain;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 8px 16px rgba(2, 132, 199, 0.25));
            user-select: none;
            -webkit-user-select: none;
        }

        .punch-target-img.hit {
            transform: scale(0.82) rotate(-10deg);
        }

        .punch-stage {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: clamp(190px, 28vh, 240px);
            margin: 0 auto clamp(14px, 3vw, 20px) auto;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.88);
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .punch-count-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.88);
            color: #0284c7;
            font-weight: bold;
            font-size: clamp(0.88rem, 2.8vw, 1rem);
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.12);
        }

        .punch-effect {
            position: absolute;
            font-size: clamp(1.25rem, 4vw, 1.6rem);
            font-weight: bold;
            color: #0284c7;
            pointer-events: none;
            animation: punchPop 0.65s ease-out forwards;
            z-index: 20;
        }

        @keyframes punchPop {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 1;
            }
            60% {
                transform: translate(-50%, -85%) scale(1.25);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -115%) scale(1);
                opacity: 0;
            }
        }

        .btn-done-punch {
            background: linear-gradient(135deg, #0284c7 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: clamp(10px, 2.5vw, 12px) clamp(24px, 6vw, 34px);
            font-size: clamp(0.95rem, 3.2vw, 1.08rem);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
            transition: transform 0.25s ease;
            touch-action: manipulation;
        }

        .btn-done-punch:hover {
            transform: scale(1.05);
        }

        /* Page 2 Styles */
        .page-2 {
            position: fixed;
            overflow: hidden;
        }

        .sticker {
            position: absolute;
            bottom: clamp(16px, 4vh, 40px);
            width: clamp(64px, 15vw, 95px);
            height: clamp(64px, 15vw, 95px);
            object-fit: contain;
            z-index: 5;
            pointer-events: none;
        }

        .sticker.left {
            left: clamp(14px, 4vw, 50px);
        }

        .sticker.right {
            right: clamp(14px, 4vw, 50px);
            transform: scaleX(-1);
        }

        /* အောက်ဘက် ရွေ့လျားမည့် စတစ်ကာ - အဆုံးထိရောက်မှ တစ်ပတ်လှည့်မည့် ပုံစံ */
        .sticker.moving {
            bottom: clamp(12px, 3vh, 30px);
            animation: moveAndRotateAtEnds 6s ease-in-out infinite alternate;
            z-index: 6;
        }

        @keyframes moveAndRotateAtEnds {
            0% {
                left: 14%;
                transform: scaleX(1) rotate(0deg);
            }
            47% {
                transform: scaleX(1) rotate(0deg);
            }
            50% {
                left: 68%;
                transform: scaleX(-1) rotate(360deg);
            }
            97% {
                transform: scaleX(-1) rotate(360deg);
            }
            100% {
                left: 14%;
                transform: scaleX(1) rotate(720deg);
            }
        }

        .center-text {
            color: #0284c7;
            font-size: clamp(2.1rem, 8vw, 3.2rem);
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1.5s ease-in-out;
            z-index: 10;
            text-align: center;
            padding: 0 16px;
        }

        .center-text.show {
            opacity: 1;
            transform: scale(1);
            text-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
        }

        .flying-heart {
            position: absolute;
            font-size: clamp(16px, 3.5vw, 22px);
            pointer-events: none;
            z-index: 2;
            animation: arcFly 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes arcFly {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 1;
            }
            50% {
                transform: translate(var(--mid-x), var(--mid-y)) scale(1.2);
                opacity: 0.9;
            }
            100% {
                transform: translate(var(--dest-x), var(--dest-y)) scale(1);
                opacity: 0;
            }
        }

        .next-arrow {
            position: fixed;
            bottom: clamp(20px, 4vh, 40px);
            right: clamp(20px, 4vw, 50px);
            background: #0284c7;
            color: white;
            border: none;
            width: clamp(46px, 11vw, 56px);
            height: clamp(46px, 11vw, 56px);
            border-radius: 50%;
            font-size: clamp(1.25rem, 4vw, 1.6rem);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, background 0.3s ease;
            touch-action: manipulation;
        }

        .next-arrow:hover {
            transform: scale(1.1);
            background: #0369a1;
        }

        /* Page 3 Styles */
        .page-3 {
            position: fixed;
            overflow: hidden;
            padding: 0 !important;
        }

        .envelope-full-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .envelope-bg-img {
            width: min(85%, 450px);
            max-height: 68vh;
            height: auto;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            display: block;
        }

        .instruction-banner-overlay {
            position: fixed;
            bottom: clamp(20px, 4vh, 36px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(2, 132, 199, 0.88);
            color: white;
            padding: clamp(10px, 2.5vw, 12px) clamp(20px, 5vw, 30px);
            border-radius: 30px;
            font-size: clamp(0.92rem, 3vw, 1.1rem);
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10;
            white-space: nowrap;
            animation: pulseBanner 1.5s infinite;
        }

        @keyframes pulseBanner {
            0%, 100% {
                transform: translateX(-50%) scale(1);
            }
            50% {
                transform: translateX(-50%) scale(1.03);
            }
        }

        /* Page 4 Styles */
        .page-4 {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #fbcfe8 100%);
            position: fixed;
            padding: clamp(14px, 3vw, 24px) !important;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .letter-paper {
            width: 100%;
            max-width: 560px;
            min-height: min(76vh, 520px);
            max-height: 86vh;
            background: rgba(255, 255, 255, 0.95);
            padding: clamp(22px, 5vw, 40px) clamp(18px, 4vw, 30px);
            border-radius: 20px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.85);
            animation: fadeInUp 0.8s ease forwards;
            z-index: 10;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .letter-paper h2 {
            color: #0284c7;
            font-size: clamp(1.35rem, 4.5vw, 1.85rem);
            margin-bottom: 12px;
            font-family: 'Segoe UI', cursive, sans-serif;
        }

        .letter-paper p {
            color: #1e293b;
            font-size: clamp(0.95rem, 3.1vw, 1.08rem);
            line-height: 1.8;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 16px;
        }

        .letter-btn-group {
            display: flex;
            justify-content: center;
            gap: clamp(10px, 3vw, 15px);
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .letter-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: clamp(9px, 2.2vw, 10px) clamp(20px, 5vw, 28px);
            border-radius: 25px;
            cursor: pointer;
            font-size: clamp(0.9rem, 3vw, 1rem);
            transition: transform 0.25s ease, background 0.25s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            touch-action: manipulation;
        }

        .letter-btn:hover {
            background: #0369a1;
            transform: scale(1.05);
        }

        .letter-btn-close {
            background: #64748b;
        }

        .letter-btn-close:hover {
            background: #475569;
        }

        .firework-particle {
            position: fixed;
            font-size: clamp(18px, 4vw, 24px);
            pointer-events: none;
            z-index: 999;
            animation: fireworkExplosion 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fireworkExplosion {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- နောက်ခံသီချင်း (Web ဖွင့်လိုက်သည်နှင့် အလိုအလျောက် ဖွင့်မည်) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="kaly.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-floating-heart" style="left: 10%; animation-delay: 0s;">💖</div>
    <div class="bg-floating-heart" style="left: 25%; animation-delay: 2s;">☁️</div>
    <div class="bg-floating-heart" style="left: 40%; animation-delay: 1s;">🌸</div>
    <div class="bg-floating-heart" style="left: 60%; animation-delay: 3s;">☁️</div>
    <div class="bg-floating-heart" style="left: 75%; animation-delay: 1.5s;">💙</div>
    <div class="bg-floating-heart" style="left: 90%; animation-delay: 2.5s;">✨</div>

    <!-- ================= INTRO PUNCH CHOICE PAGE (စာသားနှင့် ခလုတ်များသာ) ================= -->
    <div class="page active" id="punchIntroPage">
        <div class="card">
            <h1>စိတ်ဆိုးပြေတဲ့အထိ စိတ်ကြိုက်ထိုးပါ</h1>

            <div class="btn-group">
                <button class="btn" onclick="goToPunchArena()">ထိုးမယ်</button>
                <button class="btn btn-no" id="noPunchBtn" onclick="hideNoPunchBtn()">မထိုးဘူး</button>
            </div>
        </div>
    </div>

    <!-- ================= PUNCH ARENA PAGE (ထိုးမယ် ရွေးပြီးမှ Sticker ထည့်ပေးထားသော စာမျက်နှာ) ================= -->
    <div class="page" id="punchArenaPage">
        <div class="card">
            <h1>စိတ်ဆိုးပြေတဲ့အထိ စိတ်ကြိုက်ထိုးပါ</h1>
            <div class="punch-count-badge">ထိုးပြီးသား အကြိမ်ရေ : <span id="punchCount">0</span></div>

            <div class="punch-stage" id="punchStage" onclick="handlePunchHit(event)">
                <img src="bu.gif" alt="Punch Target" class="punch-target-img" id="punchTargetImg">
            </div>

            <div class="btn-group">
                <button class="btn-done-punch" onclick="goToOriginalPage1()">ထိုးလို့၀ပြီ</button>
            </div>
        </div>
    </div>

    <!-- ================= PAGE 1 ================= -->
    <div class="page" id="page1">
        <div class="card">
            <h1>စိတ်ဆိုးနေသေးလားဟင်... 🥺</h1>
            
            <div class="media-container">
                <img src="cry.gif" alt="Cute GIF">
            </div>

            <p>စိတ်ဆိုးပြေတော့နော်....💙</p>

            <div class="btn-group" id="btnGroup">
                <button class="btn btn-no" id="noBtn" onclick="handleNoClick(event)">ဆိုးတယ်</button>
                <button class="btn" id="yesBtn" onclick="handleYesClick(event)">မဆိုးတော့ဘူး </button>
            </div>
        </div>
    </div>

    <!-- ================= PAGE 2 ================= -->
    <div class="page page-2" id="page2">
        <img src="love.webp" class="sticker left" id="leftSticker" alt="Sticker">
        <img src="love.webp" class="sticker right" id="rightSticker" alt="Sticker">
        <!-- အောက်ဘက်တွင် ဘယ်မှညာသို့ ရွေ့လျားမည့် စတစ်ကာအသစ် -->
        <img src="dudu.webp" class="sticker moving" id="movingSticker" alt="Sticker">

        <div class="center-text" id="sorryText">Sorry🥺</div>

        <button class="next-arrow" id="nextArrow" onclick="goToPage3()">➔</button>
    </div>

    <!-- ================= PAGE 3 ================= -->
    <div class="page page-3" id="page3">
        <div class="envelope-full-container" onclick="goToPage4()">
            <img src="en.jpg" alt="Envelope Background" class="envelope-bg-img">
            <div class="instruction-banner-overlay">💌 ဤစာအိတ်လေးကို နှိပ်ပါ 💌</div>
        </div>
    </div>

    <!-- ================= PAGE 4 ================= -->
    <div class="page page-4" id="page4">
        <div class="letter-paper" id="letterContentBox">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        let clickCount = 0;
        const maxClicks = 5;
        let punchCount = 0;

        // Browser ၏ အလိုအလျောက် သီချင်းပိတ်ထားတတ်သော စနစ် (Autoplay Policy) ကို ကျော်လွန်ပြီး 
        // မျက်နှာပြင်ပေါ်ရှိ မည်သည့်နေရာကိုမဆို ပထမဆုံးအကြိမ် နှိပ်လိုက်သည်နှင့် သီချင်းစတင်ပွင့်စေရန်
        document.addEventListener('click', function() {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(error => {
                    console.log("Audio play prevented: ", error);
                });
            }
        }, { once: true });

        function hideNoPunchBtn() {
            document.getElementById('noPunchBtn').style.display = 'none';
        }

        function showNoPunchBtn() {
            document.getElementById('noPunchBtn').style.display = 'inline-block';
        }

        function goToPunchArena() {
            punchCount = 0;
            document.getElementById('punchCount').innerText = punchCount;
            document.getElementById('punchIntroPage').classList.remove('active');
            document.getElementById('punchArenaPage').classList.add('active');
        }

        function handlePunchHit(event) {
            punchCount++;
            document.getElementById('punchCount').innerText = punchCount;

            const target = document.getElementById('punchTargetImg');
            target.classList.remove('hit');
            void target.offsetWidth;
            target.classList.add('hit');
            setTimeout(() => target.classList.remove('hit'), 130);

            createFireworks(event, ['👊', '💥', '💢', '💫', '✨']);

            const stage = document.getElementById('punchStage');
            const rect = stage.getBoundingClientRect();
            const touch = event.touches && event.touches[0];
            const rawX = event.clientX || (touch ? touch.clientX : rect.left + rect.width / 2);
            const rawY = event.clientY || (touch ? touch.clientY : rect.top + rect.height / 2);
            const hitX = rawX - rect.left;
            const hitY = rawY - rect.top;

            const pop = document.createElement('div');
            pop.className = 'punch-effect';
            pop.innerText = ['👊', '💥', '💢'][punchCount % 3];
            pop.style.left = hitX + 'px';
            pop.style.top = hitY + 'px';
            stage.appendChild(pop);

            setTimeout(() => pop.remove(), 650);
        }

        function goToOriginalPage1() {
            document.getElementById('punchIntroPage').classList.remove('active');
            document.getElementById('punchArenaPage').classList.remove('active');
            document.getElementById('page1').classList.add('active');
        }

        function handleNoClick(event) {
            clickCount++;
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            createFireworks(event, ['💔', '💔', '💔', '💔', '💔']);

            if (clickCount === 1) {
                yesBtn.innerText = "မဆိုးတော့ဘူး";
                yesBtn.style.transform = `scale(1.15)`;
            } else if (clickCount === 2) {
                yesBtn.innerText = "မဆိုးပါနဲ့တော့ 🥺";
                yesBtn.style.transform = `scale(1.3)`;
            } else if (clickCount === 3) {
                yesBtn.innerText = "မဆိုးဘူး 🤪";
                yesBtn.style.transform = `scale(1.45)`;
            } else if (clickCount === 4) {
                yesBtn.innerText = "မဆိုးပါနဲ့ဆို 😭";
                yesBtn.style.transform = `scale(1.6)`;
            } else if (clickCount >= maxClicks) {
                yesBtn.innerText = "မဆိုးတော့ဘူးမလား ဟိဟိ 💙";
                yesBtn.classList.add('centered-final-btn');
                noBtn.style.display = 'none'; 
            }
        }

        function handleYesClick(event) {
            createFireworks(event, ['💖', '💘', '✨', '🌸', '💙']);
            setTimeout(() => {
                goToPage2();
            }, 600);
        }

        function createFireworks(event, emojiList) {
            const count = 25; 
            const touch = event && event.touches && event.touches[0];
            const clientX = (event && event.clientX) || (touch ? touch.clientX : window.innerWidth / 2);
            const clientY = (event && event.clientY) || (touch ? touch.clientY : window.innerHeight / 2);

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework-particle');
                particle.innerHTML = emojiList[Math.floor(Math.random() * emojiList.length)];
                
                particle.style.left = clientX + 'px';
                particle.style.top = clientY + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 140;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        function goToPage2() {
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.add('active');
            startStickerArcAnimation();
        }

        function goToPage3() {
            document.getElementById('page2').classList.remove('active');
            document.getElementById('page3').classList.add('active');
        }

        function goToPage4() {
            document.getElementById('page3').classList.remove('active');
            document.getElementById('page4').classList.add('active');
            showFirstLetterPage();
        }

        function startStickerArcAnimation() {
            const leftSticker = document.getElementById('leftSticker');
            const rightSticker = document.getElementById('rightSticker');
            const movingSticker = document.getElementById('movingSticker');
            
            const interval = setInterval(() => {
                createArcHeart(leftSticker, true);
                createArcHeart(rightSticker, false);
                createArcHeart(movingSticker, Math.random() > 0.5);
            }, 120);

            setTimeout(() => {
                clearInterval(interval);
                document.getElementById('sorryText').classList.add('show');
                document.getElementById('nextArrow').style.display = 'flex';
            }, 3200);
        }

        function createArcHeart(stickerElement, isLeft) {
            const rect = stickerElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const heart = document.createElement('div');
            heart.classList.add('flying-heart');
            heart.innerHTML = '💙';
            heart.style.left = startX + 'px';
            heart.style.top = startY + 'px';

            const destX = centerX - startX + (Math.random() - 0.5) * 100;
            const destY = centerY - startY + (Math.random() - 0.5) * 60;
            const midX = destX * 0.5 + (isLeft ? 50 : -50);
            const midY = destY * 0.3 - 100;

            heart.style.setProperty('--mid-x', midX + 'px');
            heart.style.setProperty('--mid-y', midY + 'px');
            heart.style.setProperty('--dest-x', destX + 'px');
            heart.style.setProperty('--dest-y', destY + 'px');

            document.getElementById('page2').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 2500);
        }

        function showFirstLetterPage() {
            const box = document.getElementById('letterContentBox');
            box.innerHTML = `
                <h2>Happy Forever! ✨</h2>
                <p>
                    ဒီစာလေးကို ဖတ်နေရပြီဆိုရင်
ကိုကို အမှားအတွက် တကယ်ကို စိတ်ရင်းနဲ့တောင်းပန်ပါတယ်နော်
နှင်း' စိတ်ဆိုးစေမဲ့ အမှားမျိုးကို 
နောက်တစ်ခါ မလုပ်မိစေရတော့ဘူးလို 
ကတိပေးပါတယ်နော်
                </p>
                <div class="letter-btn-group">
                    <button class="letter-btn" onclick="showSecondLetterPage()">ဆက်ဖတ်ရန် ✨</button>
                    <button class="letter-btn letter-btn-close" onclick="restartWebsite()">ပြန်စမည် 🔄</button>
                </div>
            `;
        }

        function showSecondLetterPage() {
            const box = document.getElementById('letterContentBox');
            box.innerHTML = `
                <h2>You're my one love 💌</h2>
                <p>
နှင်း'က ကိုကို့ ဘဝမှာ အချစ်ဦးနဲ့ အချစ်ဆုံးပါဘဲနော် <br>
အဖိုးကြီး အဖွားကြီး ဖြစ်တဲ့အထိ နှင်း'နဲ့ဘဲ အချိန်တွေကုန်ဆုံးချင်တယ်
အမြဲတမ်း နှင်း'အပေါ်မှာ အနွံနာခံပြီး ချစ်ပေးမှာမို့လို့ တစ်သက်လုံး နှင်း'ရဲ့ အနားမှာ 
ကိုကို့ ကိုနေခွင့်ပြုပါနော် အရမ်းချစ်တယ်💞😘 
                </p>
                <div class="letter-btn-group">
                    <button class="letter-btn letter-btn-close" onclick="restartWebsite()">အစမှ ပြန်စမည် 🔄</button>
                </div>
            `;
        }

        function restartWebsite() {
            showNoPunchBtn();
            document.getElementById('page4').classList.remove('active');
            document.getElementById('punchIntroPage').classList.add('active');
            clickCount = 0;
            punchCount = 0;
            document.getElementById('punchCount').innerText = 0;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('centered-final-btn');
            yesBtn.style.transform = 'scale(1)';
            yesBtn.innerText = "မဆိုးတော့ဘူး ";
            document.getElementById('noBtn').style.display = 'inline-block';
            document.getElementById('sorryText').classList.remove('show');
            document.getElementById('nextArrow').style.display = 'none';
        }
    </script>
</body>
</html>
